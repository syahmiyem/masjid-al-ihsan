# Builds and deploys the site to Cloudflare (docs/plan.md 9.6).
# Triggers: merge to main, Sanity publish webhook, nightly rebuild at 00:05 MYT (keeps "today"
# correct for Waktu Solat and the calendar), and manual runs.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: '5 16 * * *' # 00:05 Asia/Kuala_Lumpur
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if Cloudflare is not set up yet
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Stays 'true' (test site) until the repo variable UAT_MODE is set to 'false' at go-live.
          UAT_MODE: ${{ vars.UAT_MODE || 'true' }}
      - name: Deploy to Cloudflare
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
