# Alerts the Pengerusi and Bendahari whenever donation details change (docs/plan.md 4.9, D-81).
# Set the repo variable DERMA_NOTIFY to their GitHub handles, e.g. "@bendahari @pengerusi".
name: Derma change alert

on:
  pull_request:
    paths: ['config/derma/**']
  push:
    branches: [main]
    paths: ['config/derma/**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Warn on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --body \
            "⚠️ **Perubahan butiran derma.** ${{ vars.DERMA_NOTIFY }} Sila semak nama pemegang akaun, nombor akaun dan kod QR dengan surat bank sebelum meluluskan."
      - name: Open an issue after the change is merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Butiran derma telah berubah ($(date -u +%F))" \
            --body "${{ vars.DERMA_NOTIFY }} Butiran derma di laman web telah dikemas kini. Perubahan: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          Jika perubahan ini tidak dijangka, hubungi pentadbir laman web dengan segera. Selepas laman dikemas kini, imbas kod QR dengan dua aplikasi bank dan sahkan nama penerima."
