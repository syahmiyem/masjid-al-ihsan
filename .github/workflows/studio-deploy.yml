# Deploys the Sanity Studio to <SANITY_STUDIO_HOST>.sanity.studio when it changes (docs/plan.md 9.6).
name: Deploy Studio

on:
  push:
    branches: [main]
    paths: ['apps/studio/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if Sanity is not set up yet
        id: gate
        env:
          TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          PROJECT: ${{ vars.SANITY_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "::notice::SANITY_AUTH_TOKEN or SANITY_PROJECT_ID not set — Studio deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm --filter studio exec sanity deploy -y
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST || 'masjid-al-ihsan' }}
