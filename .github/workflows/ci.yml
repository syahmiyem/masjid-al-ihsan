# Checks every pull request and every push to main (docs/plan.md 9.6).
# Pull requests from this repo also get a Cloudflare preview URL once the Cloudflare secrets exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - name: Build site (UAT mode)
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          UAT_MODE: 'true'
      - name: Build Studio
        run: pnpm --filter studio build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}

  preview:
    # Only for PRs from branches in this repo (fork PRs never see secrets).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Skip if Cloudflare is not set up yet
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — preview skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          UAT_MODE: 'true'
      - name: Upload preview version
        if: steps.gate.outputs.ready == 'true'
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.gate.outputs.ready == 'true' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "Pratonton (preview): ${{ steps.upload.outputs.url }}"
